name: Deploy to Google Play

on:
  workflow_dispatch:
    inputs:
      backend:
        description: "WebGPU backend"
        required: true
        default: "wgpu"
        type: choice
        options:
          - wgpu
          - dawn
      description:
        description: "Release description"
        default: "Generate release build"
      track:
        description: "Release track (internal or beta)"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - beta

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_FILE: ${{ github.workspace }}/app/android/keystore.jks
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"

      - name: Build WGPU release bundle
        if: ${{ inputs.backend == 'wgpu' }}
        run: ./gradlew :app:android:bundleWgpuRelease --stacktrace

      - name: Build Dawn release bundle
        if: ${{ inputs.backend == 'dawn' }}
        run: ./gradlew :app:android:bundleDawnRelease --stacktrace

      - name: Upload WGPU bundle to Play Store
        if: ${{ inputs.backend == 'wgpu' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.github.xpenatan.webgpu.demo
          releaseFiles: app/android/build/outputs/bundle/wgpuRelease/android-wgpu-release.aab
          track: ${{ inputs.track }}
          status: completed

      - name: Upload Dawn bundle to Play Store
        if: ${{ inputs.backend == 'dawn' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.github.xpenatan.webgpu.demo
          releaseFiles: app/android/build/outputs/bundle/dawnRelease/android-dawn-release.aab
          track: ${{ inputs.track }}
          status: completed
